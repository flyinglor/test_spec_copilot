name: Project Validation

on:
  push:
    branches:
      - main
      - master
      - '001-*'
    paths:
      - '.github/workflows/spec_validation.yml'
      - 'app/**'
      - 'components/**'
      - 'content/**'
      - 'specs/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'next.config.ts'
      - 'eslint.config.mjs'
  pull_request:
    paths:
      - '.github/workflows/spec_validation.yml'
      - 'app/**'
      - 'components/**'
      - 'content/**'
      - 'specs/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'next.config.ts'
      - 'eslint.config.mjs'
  workflow_dispatch:

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build static site
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high